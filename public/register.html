<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Spendify</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="glass-panel auth-card">
      <div class="text-center mb-3">
        <h2 style="color: var(--primary); font-size: 2rem;">Spendify</h2>
        <p>Create a new account</p>
      </div>
      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" class="form-control" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="form-control" required placeholder="john@example.com">
        </div>
        <div class="form-group mb-3">
          <label>Password</label>
          <input type="password" id="password" class="form-control" required minlength="6" placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Register</button>
      </form>
      <div class="text-center mt-3">
        <p>Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/ui.js"></script>
  <script>
    window.UI.checkAuth(false);

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await window.API.registerUser(name, email, password);
        await window.API.loginUser(email, password); // Auto login
        window.UI.showToast("Registration successful!", "success");
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } catch (err) {
        window.UI.showToast(err.message, "danger");
      }
    });
  </script>
</body>
</html>

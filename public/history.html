<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense History - Spendify</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <div class="header">
        <div>
          <h2>Expense History</h2>
          <p>Review all your past transactions.</p>
        </div>
      </div>

      <div class="glass-panel table-container">
        <table id="history-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Name</th>
              <th>Category</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <!-- Expenses injected here -->
          </tbody>
        </table>
        <div id="empty-state" class="text-center mt-4" style="display: none; color: var(--text-muted);">
          <i class="fa-solid fa-receipt fa-3x mb-2" style="opacity: 0.5;"></i>
          <p>No expenses found. Time to add some!</p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (async () => {
      const user = await window.UI.checkAuth(true);
      if (!user) return;
      window.UI.injectSidebar('history');

      async function renderHistory() {
        let expenses = [];
        try {
          expenses = await window.API.getExpenses();
        } catch(e){
          window.UI.showToast("Failed to fetch expenses", "danger");
        }

        const tbody = document.querySelector('#history-table tbody');
        tbody.innerHTML = '';

        if (expenses.length === 0) {
          document.getElementById('history-table').style.display = 'none';
          document.getElementById('empty-state').style.display = 'block';
          return;
        }

        document.getElementById('history-table').style.display = 'table';
        document.getElementById('empty-state').style.display = 'none';

        expenses.forEach(exp => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${exp.date}</td>
            <td style="font-weight: 500; color: var(--text-main);">${exp.name}</td>
            <td><span style="font-size: 0.8rem; padding: 4px 8px; background: rgba(255,255,255,0.1); border-radius: 12px;">${exp.category}</span></td>
            <td style="font-weight: bold; color: var(--danger);">-$${exp.amount.toFixed(2)}</td>
            <td>
              <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.8rem;" onclick="deleteExpense('${exp._id}')">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      window.deleteExpense = async (id) => {
        if(confirm('Are you sure you want to delete this expense?')) {
          try {
            await window.API.deleteExpense(id);
            await renderHistory();
            window.UI.showToast("Expense deleted.", "success");
          } catch(e) {
            window.UI.showToast(e.message, "danger");
          }
        }
      }
      
      renderHistory();
    })();
  </script>
</body>
</html>

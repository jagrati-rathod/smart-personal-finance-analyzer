<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Spendify</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="glass-panel auth-card">
      <div class="text-center mb-3">
        <h2 style="color: var(--primary); font-size: 2rem;">Spendify</h2>
        <p>Welcome back! Please login.</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="form-control" required placeholder="Enter your email">
        </div>
        <div class="form-group mb-3">
          <label>Password</label>
          <input type="password" id="password" class="form-control" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
      <div class="text-center mt-3">
        <p>Don't have an account? <a href="register.html">Register</a></p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/ui.js"></script>
  <script>
    window.UI.checkAuth(false);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await window.API.loginUser(email, password);
        window.UI.showToast("Login successful!", "success");
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } catch (err) {
        window.UI.showToast(err.message, "danger");
      }
    });
  </script>
</body>
</html>
